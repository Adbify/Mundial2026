<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Mundial 2026 - Resultados en Vivo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;800;900&family=Hanken+Grotesk:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --green: #1a7a4a;
            --green-dark: #155f3a;
            --green-light: #e8f5ee;
            --green-mid: #2d9e60;
            --accent: #4caf7d;
            --text: #1c1b1b;
            --text-muted: #888;
            --border: #e8e8e8;
            --bg: #f7f8f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Hanken Grotesk', sans-serif; }

        /* HEADER */
        .header { background: var(--green-dark); color: #fff; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .header-title { font-family: 'Chivo', sans-serif; font-size: 1.6rem; font-weight: 900; }
        .header-sub { font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }
        .live-dot { width: 8px; height: 8px; background: #6ee7a0; border-radius: 50%; animation: pulse 2s infinite; display: inline-block; margin-right: 6px; }
        .live-label { font-size: 0.78rem; font-weight: 600; color: #6ee7a0; display: flex; align-items: center; }
        .update-time { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 4px; text-align: right; }

        /* NAV */
        .nav { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 68px; z-index: 40; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; padding: 0 24px; overflow-x: auto; }
        .tab-btn { padding: 14px 18px; font-family: 'Chivo', sans-serif; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; border: none; background: none; cursor: pointer; color: var(--text-muted); border-bottom: 2.5px solid transparent; white-space: nowrap; transition: all 0.15s; }
        .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
        .tab-btn:hover:not(.active) { color: var(--text); }

        /* CONTENT */
        .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title { font-family: 'Chivo', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--green-dark); margin-bottom: 16px; }

        /* MATCH CARD */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 32px; }
        .match-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px; transition: box-shadow 0.15s, transform 0.15s; }
        .match-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-group { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
        .card-status { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); }
        .card-status.live { color: #c0392b; animation: pulse 2s infinite; }
        .card-status.finished { color: var(--green); }
        .team-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        .team-flag { font-size: 1.5rem; width: 2rem; text-align: center; flex-shrink: 0; }
        .team-name { flex: 1; font-weight: 600; font-size: 0.88rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-score { font-family: 'Chivo', sans-serif; font-size: 1.5rem; font-weight: 900; min-width: 1.8rem; text-align: right; }
        .team-score.scored { color: var(--text); }
        .team-score.pending { color: #ddd; }
        .card-divider { height: 1px; background: #f2f2f2; }
        .card-date { font-size: 0.7rem; color: #bbb; margin-top: 10px; }
        .card-scorers { display: flex; justify-content: space-between; font-size: 0.66rem; color: #bbb; margin-top: 8px; gap: 8px; }
        .loading-card { background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200%; animation: shimmer 1.4s infinite; border-radius: 14px; height: 130px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* GROUP CARD */
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
        .group-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .group-card-header { background: var(--green-light); padding: 12px 16px; font-family: 'Chivo', sans-serif; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; color: var(--green-dark); text-transform: uppercase; }
        .group-team-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f5f5f5; }
        .group-team-row:last-child { border-bottom: none; }
        .group-team-row.qualifier { background: #f6fdf9; }
        .qualifier-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .no-dot { width: 6px; height: 6px; flex-shrink: 0; }
        .group-team-flag { font-size: 1.3rem; width: 1.8rem; text-align: center; }
        .group-team-name { flex: 1; font-size: 0.85rem; font-weight: 600; }
        .group-team-mp { font-size: 0.68rem; font-weight: 700; color: #bbb; }

        /* STANDINGS */
        .standings-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .standings-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .standings-header { background: var(--green-light); padding: 12px 20px; font-family: 'Chivo', sans-serif; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; color: var(--green-dark); text-transform: uppercase; }
        .standings-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .standings-table th { padding: 10px 12px; text-align: center; font-size: 0.68rem; font-weight: 700; color: #aaa; letter-spacing: 0.04em; border-bottom: 1px solid #f2f2f2; }
        .standings-table th:first-child { text-align: left; padding-left: 20px; }
        .standings-table th:last-child { padding-right: 20px; }
        .standings-table td { padding: 11px 12px; text-align: center; color: #555; border-bottom: 1px solid #f8f8f8; }
        .standings-table td:first-child { text-align: left; padding-left: 20px; }
        .standings-table td:last-child { padding-right: 20px; font-weight: 800; color: var(--green-dark); }
        .standings-table tr:last-child td { border-bottom: none; }
        .standings-table tr.qualifier-row { background: #f6fdf9; }
        .td-team { display: flex; align-items: center; gap: 8px; }
        .td-team-flag { font-size: 1.2rem; }
        .td-qualifier-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .td-no-dot { width: 6px; height: 6px; flex-shrink: 0; }

        /* BRACKET TAB */
        .bracket-container { overflow-x: auto; padding-bottom: 16px; }
        .bracket { display: flex; gap: 0; min-width: 900px; }
        .bracket-round { flex: 1; display: flex; flex-direction: column; }
        .bracket-round-title { font-family: 'Chivo', sans-serif; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); text-align: center; padding: 8px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 0; }
        .bracket-slots { flex: 1; display: flex; flex-direction: column; padding: 8px 6px; gap: 0; }
        .bracket-match { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin: 6px; overflow: hidden; }
        .bracket-team { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 0.78rem; font-weight: 600; }
        .bracket-team:first-child { border-bottom: 1px solid #f2f2f2; }
        .bracket-team.winner { background: var(--green-light); font-weight: 800; color: var(--green-dark); }
        .bracket-team-flag { font-size: 1.1rem; }
        .bracket-team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bracket-team-score { font-family: 'Chivo', sans-serif; font-weight: 900; font-size: 1rem; color: var(--text); }
        .bracket-team-score.winner-score { color: var(--green); }
        .bracket-spacer { flex: 1; }
        .bracket-tbd { background: #f8f8f8; border: 1px dashed #ddd; border-radius: 10px; margin: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .bracket-tbd-team { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #bbb; font-style: italic; }
        .bracket-tbd-team:first-child { border-bottom: 1px dashed #eee; padding-bottom: 6px; }
        .bracket-tbd-dot { width: 20px; height: 20px; border-radius: 50%; background: #eee; }

        /* FOOTER */
        .footer { background: var(--green-dark); color: rgba(255,255,255,0.6); text-align: center; padding: 16px 24px; font-size: 0.72rem; margin-top: 48px; }
        .footer strong { color: rgba(255,255,255,0.9); }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .header-title { font-size: 1.2rem; }
            .main { padding: 16px; }
            .cards-grid { grid-template-columns: 1fr; }
        }
        ::-webkit-scrollbar { height: 5px; width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 10px; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div>
            <div class="header-title">⚽ Copa Mundial 2026</div>
            <div class="header-sub">Resultados en Vivo • Datos en Tiempo Real</div>
        </div>
        <div style="text-align:right">
            <div class="live-label"><span class="live-dot"></span>EN VIVO</div>
            <div class="update-time" id="last-update">Actualizando...</div>
        </div>
    </header>

    <!-- Nav -->
    <nav class="nav">
        <div class="nav-inner">
            <button class="tab-btn active" onclick="showTab('matches')">⚽ Partidos</button>
            <button class="tab-btn" onclick="showTab('groups')"># Grupos</button>
            <button class="tab-btn" onclick="showTab('standings')">📊 Clasificación</button>
            <button class="tab-btn" onclick="showTab('bracket')">🏆 Llaves</button>
        </div>
    </nav>

    <!-- Main -->
    <main class="main">
        <!-- PARTIDOS -->
        <div id="matches-tab" class="tab-content active">
            <div class="section-title">Últimos Partidos</div>
            <div id="matches-container" class="cards-grid">
                <div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div>
            </div>
            <div class="section-title">Próximos Partidos</div>
            <div id="upcoming-container" class="cards-grid">
                <div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div>
            </div>
        </div>

        <!-- GRUPOS -->
        <div id="groups-tab" class="tab-content">
            <div class="section-title">Grupos del Torneo</div>
            <div id="groups-container" class="groups-grid">
                <div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div>
            </div>
        </div>

        <!-- CLASIFICACIÓN -->
        <div id="standings-tab" class="tab-content">
            <div class="section-title">Clasificación por Grupos</div>
            <div id="standings-container" class="standings-grid">
                <div class="loading-card" style="height:200px"></div>
            </div>
        </div>

        <!-- LLAVES -->
        <div id="bracket-tab" class="tab-content">
            <div class="section-title">Llaves del Torneo</div>
            <div class="bracket-container">
                <div id="bracket-container"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <strong>Copa Mundial FIFA 2026</strong> &nbsp;•&nbsp; Última actualización: <span id="footer-update">—</span>
    </footer>

    <script>
    const API_BASE = 'https://worldcup26.ir/get';
    let allMatches = [];
    let allTeams = {};

    // ── Flags ──────────────────────────────────────────────
    function isoToEmoji(code) {
        if (!code || code.length !== 2) return null;
        const c = code.toUpperCase();
        // Validar que ambos caracteres son letras A-Z
        if (!/^[A-Z]{2}$/.test(c)) return null;
        return String.fromCodePoint(
            0x1F1E6 + c.charCodeAt(0) - 65,
            0x1F1E6 + c.charCodeAt(1) - 65
        );
    }

    const NAME_ISO = {
        'Mexico':'MX','South Africa':'ZA','South Korea':'KR','Czech Republic':'CZ',
        'Czechia':'CZ','Canada':'CA','Bosnia and Herzegovina':'BA','United States':'US',
        'USA':'US','Paraguay':'PY','Brazil':'BR','Morocco':'MA','Qatar':'QA',
        'Switzerland':'CH','Ivory Coast':'CI',"Côte d'Ivoire":'CI','Ecuador':'EC',
        'Belgium':'BE','Argentina':'AR','Australia':'AU','Austria':'AT','Curacao':'CW',
        'Denmark':'DK','Egypt':'EG','United Arab Emirates':'AE','England':'GB',
        'Scotland':'GB','Wales':'GB','Slovakia':'SK','Spain':'ES','France':'FR',
        'Germany':'DE','Ghana':'GH','Haiti':'HT','Hungary':'HU','Iraq':'IQ',
        'Iran':'IR','Italy':'IT','Japan':'JP','Jordan':'JO','New Zealand':'NZ',
        'Netherlands':'NL','Poland':'PL','Romania':'RO','Russia':'RU','Senegal':'SN',
        'Sweden':'SE','Thailand':'TH','Tunisia':'TN','Turkey':'TR','Ukraine':'UA',
        'Uruguay':'UY','Uzbekistan':'UZ','Vietnam':'VN','Norway':'NO',
        'Saudi Arabia':'SA','Cape Verde':'CV','Colombia':'CO','Chile':'CL',
        'Peru':'PE','Venezuela':'VE','Bolivia':'BO','Costa Rica':'CR',
        'Honduras':'HN','Guatemala':'GT','Panama':'PA','Jamaica':'JM','Portugal':'PT',
        'Serbia':'RS','Nigeria':'NG','Cameroon':'CM','Algeria':'DZ','El Salvador':'SV',
        'Cuba':'CU','Trinidad and Tobago':'TT','Lebanon':'LB','Kuwait':'KW',
        'Bahrain':'BH','Oman':'OM','Palestine':'PS','India':'IN','China':'CN',
        'Indonesia':'ID','Philippines':'PH','Croatia':'HR','Greece':'GR',
        'Slovenia':'SI','Albania':'AL','Kosovo':'XK','North Macedonia':'MK',
        'Montenegro':'ME','Finland':'FI','Iceland':'IS','Kenya':'KE',
        'Tanzania':'TZ','Namibia':'NA','Angola':'AO','Mozambique':'MZ',
        'Zimbabwe':'ZW','Uganda':'UG','Zambia':'ZM','Ethiopia':'ET',
        'Mali':'ML','Guinea':'GN','Benin':'BJ','Burkina Faso':'BF',
        'Mauritania':'MR','Congo':'CG','DR Congo':'CD','Libya':'LY',
        'Sudan':'SD','Comoros':'KM','New Caledonia':'NC','Fiji':'FJ',
        'Tahiti':'PF','Nicaragua':'NI','Trinidad':'TT','Guyana':'GY',
        'Suriname':'SR','Tajikistan':'TJ','Kyrgyzstan':'KG','Turkmenistan':'TM',
        'Myanmar':'MM','Singapore':'SG','Malaysia':'MY','Thailand':'TH',
        'North Korea':'KP','Rwanda':'RW','Tunisia':'TN','Libya':'LY',
        'Liberia':'LR','Sierra Leone':'SL','Guinea-Bissau':'GW'
    };

    function flag(nameOrCode) {
        if (!nameOrCode) return '🌍';
        const s = nameOrCode.trim();
        // Código ISO de 2 letras directo
        if (/^[A-Z]{2}$/.test(s)) {
            return isoToEmoji(s) || '🌍';
        }
        // Nombre en inglés → ISO
        const iso = NAME_ISO[s];
        if (iso) return isoToEmoji(iso) || '🌍';
        // Intentar mayúsculas de 2 letras
        const up = s.toUpperCase();
        if (/^[A-Z]{2}$/.test(up)) return isoToEmoji(up) || '🌍';
        return '🌍';
    }

    function teamFlag(teamId, fallbackName) {
        const info = allTeams[String(teamId || '')] || {};
        const iso = info.flag || info.iso || info.code;
        if (iso && /^[A-Z]{2}$/i.test(iso)) return isoToEmoji(iso.toUpperCase()) || flag(fallbackName);
        return flag(fallbackName);
    }

    // ── Utils ──────────────────────────────────────────────
    function toArray(data, key) {
        if (Array.isArray(data)) return data;
        if (data && key && Array.isArray(data[key])) return data[key];
        if (data && typeof data === 'object') {
            for (const k of Object.keys(data)) if (Array.isArray(data[k])) return data[k];
        }
        return [];
    }

    function parseScorers(raw) {
        if (!raw || raw === 'null') return [];
        try {
            const clean = raw.replace(/^\{/, '[').replace(/\}$/, ']').replace(/\\"/g, '"');
            return JSON.parse(clean);
        } catch(e) { return []; }
    }

    function fmtDate(local_date) {
        if (!local_date) return '';
        try {
            const [dp, tp] = local_date.split(' ');
            const [m, d, y] = dp.split('/');
            const dt = new Date(`${y}-${m}-${d}T${tp}`);
            return dt.toLocaleDateString('es-ES', {day:'numeric', month:'short'}) + ' · ' + tp;
        } catch(e) { return local_date; }
    }

    // ── Match Card ─────────────────────────────────────────
    function createMatchCard(match) {
        const el = document.createElement('div');
        el.className = 'match-card';

        const finished = match.finished === 'TRUE' || match.finished === true;
        const te = (match.time_elapsed || '').toLowerCase();
        const live = !finished && te !== 'notstarted' && te !== '' && te !== 'finished';

        const hName = match.home_team_name_en || '?';
        const aName = match.away_team_name_en || '?';
        const hFlag = teamFlag(match.home_team_id, hName);
        const aFlag = teamFlag(match.away_team_id, aName);

        const showScore = finished || live;
        const hScore = showScore ? (match.home_score ?? '-') : '-';
        const aScore = showScore ? (match.away_score ?? '-') : '-';
        const scoreCls = showScore ? 'scored' : 'pending';

        let statusTxt = 'Próximo';
        let statusCls = 'card-status';
        if (live) { statusTxt = '🔴 ' + (match.time_elapsed || 'EN VIVO'); statusCls = 'card-status live'; }
        else if (finished) { statusTxt = 'Finalizado'; statusCls = 'card-status finished'; }

        const grupo = match.group ? 'GRUPO ' + match.group : (match.type || 'GRUPO').toUpperCase();
        const dateStr = fmtDate(match.local_date);

        let scorersHtml = '';
        if (finished) {
            const hS = parseScorers(match.home_scorers);
            const aS = parseScorers(match.away_scorers);
            if (hS.length || aS.length) {
                scorersHtml = `<div class="card-scorers"><span>${hS.join(', ')}</span><span style="text-align:right">${aS.join(', ')}</span></div>`;
            }
        }

        el.innerHTML = `
            <div class="card-header">
                <span class="card-group">${grupo}</span>
                <span class="${statusCls}">${statusTxt}</span>
            </div>
            <div class="team-row">
                <span class="team-flag">${hFlag}</span>
                <span class="team-name">${hName}</span>
                <span class="team-score ${scoreCls}">${hScore}</span>
            </div>
            <div class="card-divider"></div>
            <div class="team-row">
                <span class="team-flag">${aFlag}</span>
                <span class="team-name">${aName}</span>
                <span class="team-score ${scoreCls}">${aScore}</span>
            </div>
            ${scorersHtml}
            ${dateStr ? `<div class="card-date">${dateStr}</div>` : ''}
        `;
        return el;
    }

    // ── Render Matches ─────────────────────────────────────
    function renderMatches(matches) {
        const mc = document.getElementById('matches-container');
        const uc = document.getElementById('upcoming-container');
        mc.innerHTML = ''; uc.innerHTML = '';

        const fin = matches.filter(m => m.finished === 'TRUE' || m.finished === true).slice(0, 9);
        const upco = matches.filter(m => m.finished !== 'TRUE' && m.finished !== true).slice(0, 9);

        if (!fin.length) mc.innerHTML = '<p style="color:#aaa;font-size:.85rem;padding:8px 0;">Sin partidos finalizados aún</p>';
        else fin.forEach(m => mc.appendChild(createMatchCard(m)));

        if (!upco.length) uc.innerHTML = '<p style="color:#aaa;font-size:.85rem;padding:8px 0;">Sin próximos partidos programados</p>';
        else upco.forEach(m => uc.appendChild(createMatchCard(m)));
    }

    // ── Render Groups ──────────────────────────────────────
    function renderGroups(groups) {
        const container = document.getElementById('groups-container');
        container.innerHTML = '';

        const sorted = [...groups].sort((a,b) => (a.name||'').localeCompare(b.name||''));
        sorted.forEach(group => {
            const card = document.createElement('div');
            card.className = 'group-card';

            const teams = group.teams || [];
            const sortedTeams = [...teams].sort((a,b) => (Number(b.pts)||0)-(Number(a.pts)||0) || (Number(b.gd)||0)-(Number(a.gd)||0));

            let rows = sortedTeams.map((team, idx) => {
                const tid = String(team.team_id || '');
                const info = allTeams[tid] || {};
                const name = info.name_en || info.name || ('Equipo ' + tid);
                const f = teamFlag(tid, name);
                const qualif = idx < 2;
                return `
                    <div class="group-team-row ${qualif ? 'qualifier' : ''}">
                        ${qualif ? '<span class="qualifier-dot"></span>' : '<span class="no-dot"></span>'}
                        <span class="group-team-flag">${f}</span>
                        <span class="group-team-name">${name}</span>
                        <span class="group-team-mp">${team.mp||0}PJ</span>
                    </div>
                `;
            }).join('');

            card.innerHTML = `<div class="group-card-header">Grupo ${group.name||'?'}</div>${rows}`;
            container.appendChild(card);
        });
    }

    // ── Render Standings ───────────────────────────────────
    function renderStandings(groups) {
        const container = document.getElementById('standings-container');
        container.innerHTML = '';

        const sorted = [...groups].sort((a,b) => (a.name||'').localeCompare(b.name||''));
        sorted.forEach(group => {
            const card = document.createElement('div');
            card.className = 'standings-card';

            const teams = group.teams || [];
            const st = [...teams].sort((a,b) => (Number(b.pts)||0)-(Number(a.pts)||0) || (Number(b.gd)||0)-(Number(a.gd)||0));

            let rows = st.map((team, idx) => {
                const tid = String(team.team_id || '');
                const info = allTeams[tid] || {};
                const name = info.name_en || info.name || ('Equipo ' + tid);
                const f = teamFlag(tid, name);
                const gd = Number(team.gd) || 0;
                const qualif = idx < 2;
                return `
                    <tr class="${qualif ? 'qualifier-row' : ''}">
                        <td>
                            <div class="td-team">
                                ${qualif ? '<span class="td-qualifier-dot"></span>' : '<span class="td-no-dot"></span>'}
                                <span class="td-team-flag">${f}</span>
                                <span>${name}</span>
                            </div>
                        </td>
                        <td>${team.mp||0}</td>
                        <td>${team.w||0}</td>
                        <td>${team.d||0}</td>
                        <td>${team.l||0}</td>
                        <td>${gd > 0 ? '+'+gd : gd}</td>
                        <td>${team.pts||0}</td>
                    </tr>
                `;
            }).join('');

            card.innerHTML = `
                <div class="standings-header">Grupo ${group.name||'?'}</div>
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Equipo</th>
                            <th>PJ</th><th>G</th><th>E</th><th>P</th><th>GD</th><th>PTS</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            container.appendChild(card);
        });
    }

    // ── Render Bracket ─────────────────────────────────────
    function renderBracket(matches) {
        const container = document.getElementById('bracket-container');
        container.innerHTML = '';

        // Separar por fase
        const roundOf32 = matches.filter(m => m.type === 'round_of_32' || m.matchday === '32');
        const r16 = matches.filter(m => m.type === 'round_of_16' || m.matchday === '16');
        const qf  = matches.filter(m => m.type === 'quarterfinal' || m.matchday === 'qf' || m.type === 'quarter_final');
        const sf  = matches.filter(m => m.type === 'semifinal' || m.matchday === 'sf');
        const fin = matches.filter(m => m.type === 'final');
        const third = matches.filter(m => m.type === 'third_place' || m.type === '3rd_place');

        // Si no hay partidos de llaves aún, mostrar placeholder
        const knockoutMatches = [...r16, ...qf, ...sf, ...fin];
        if (!knockoutMatches.length) {
            container.innerHTML = `
                <div style="text-align:center;padding:60px 20px;color:#aaa;">
                    <div style="font-size:3rem;margin-bottom:16px;">🏆</div>
                    <div style="font-family:'Chivo',sans-serif;font-size:1.1rem;font-weight:700;color:#555;margin-bottom:8px;">Fase de Eliminación Directa</div>
                    <div style="font-size:0.85rem;">Las llaves se mostrarán cuando inicien los octavos de final</div>
                    <div style="margin-top:24px;padding:16px;background:#f6fdf9;border:1px solid #c8e6d4;border-radius:10px;display:inline-block;text-align:left;min-width:300px;">
                        <div style="font-family:'Chivo',sans-serif;font-size:0.72rem;font-weight:800;color:var(--green-dark);letter-spacing:.06em;margin-bottom:10px;">CALENDARIO DE ELIMINATORIAS</div>
                        <div style="font-size:0.78rem;color:#555;line-height:1.8;">
                            🗓 Octavos de final: 27 jun - 3 jul<br>
                            🗓 Cuartos de final: 7 - 10 jul<br>
                            🗓 Semifinales: 14 - 15 jul<br>
                            🗓 Tercer lugar: 18 jul<br>
                            🏆 Final: 19 jul 2026
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        // Construir visualización de llaves
        const rounds = [];
        if (r16.length)  rounds.push({ label: 'Octavos de Final', matches: r16 });
        if (qf.length)   rounds.push({ label: 'Cuartos de Final', matches: qf });
        if (sf.length)   rounds.push({ label: 'Semifinales',       matches: sf });
        if (fin.length)  rounds.push({ label: 'Final',             matches: fin });

        const bracket = document.createElement('div');
        bracket.className = 'bracket';

        rounds.forEach(round => {
            const col = document.createElement('div');
            col.className = 'bracket-round';
            col.innerHTML = `<div class="bracket-round-title">${round.label}</div>`;

            const slots = document.createElement('div');
            slots.className = 'bracket-slots';

            round.matches.forEach(m => {
                const finished = m.finished === 'TRUE' || m.finished === true;
                const hName = m.home_team_name_en || 'Por definir';
                const aName = m.away_team_name_en || 'Por definir';
                const hFlag = teamFlag(m.home_team_id, hName);
                const aFlag = teamFlag(m.away_team_id, aName);
                const hScore = finished ? (m.home_score || '0') : '';
                const aScore = finished ? (m.away_score || '0') : '';
                const hWin = finished && Number(m.home_score) > Number(m.away_score);
                const aWin = finished && Number(m.away_score) > Number(m.home_score);

                const el = document.createElement('div');
                el.className = 'bracket-match';
                el.innerHTML = `
                    <div class="bracket-team ${hWin ? 'winner' : ''}">
                        <span class="bracket-team-flag">${hFlag}</span>
                        <span class="bracket-team-name">${hName}</span>
                        <span class="bracket-team-score ${hWin ? 'winner-score' : ''}">${hScore}</span>
                    </div>
                    <div class="bracket-team ${aWin ? 'winner' : ''}">
                        <span class="bracket-team-flag">${aFlag}</span>
                        <span class="bracket-team-name">${aName}</span>
                        <span class="bracket-team-score ${aWin ? 'winner-score' : ''}">${aScore}</span>
                    </div>
                `;
                slots.appendChild(el);
            });

            // Relleno si hay pocas entradas para alinear con la siguiente ronda
            const spacer = document.createElement('div');
            spacer.className = 'bracket-spacer';
            slots.appendChild(spacer);

            col.appendChild(slots);
            bracket.appendChild(col);
        });

        // Tercer puesto
        if (third.length) {
            const m = third[0];
            const finished = m.finished === 'TRUE';
            const thirdDiv = document.createElement('div');
            thirdDiv.style.cssText = 'margin-top:24px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px;max-width:320px;';
            const hName = m.home_team_name_en || '?';
            const aName = m.away_team_name_en || '?';
            thirdDiv.innerHTML = `
                <div style="font-family:'Chivo',sans-serif;font-size:0.72rem;font-weight:800;color:#aaa;letter-spacing:.06em;margin-bottom:10px;">🥉 TERCER LUGAR</div>
                <div class="bracket-team">
                    <span class="bracket-team-flag">${teamFlag(m.home_team_id, hName)}</span>
                    <span class="bracket-team-name">${hName}</span>
                    <span class="bracket-team-score">${finished ? m.home_score : ''}</span>
                </div>
                <div style="height:1px;background:#f2f2f2;"></div>
                <div class="bracket-team">
                    <span class="bracket-team-flag">${teamFlag(m.away_team_id, aName)}</span>
                    <span class="bracket-team-name">${aName}</span>
                    <span class="bracket-team-score">${finished ? m.away_score : ''}</span>
                </div>
            `;
            container.appendChild(bracket);
            container.appendChild(thirdDiv);
            return;
        }

        container.appendChild(bracket);
    }

    // ── Fetch ──────────────────────────────────────────────
    async function fetchAll() {
        try {
            const [mr, tr, gr] = await Promise.all([
                fetch(`${API_BASE}/games`),
                fetch(`${API_BASE}/teams`),
                fetch(`${API_BASE}/groups`)
            ]);
            const mRaw = await mr.json();
            const tRaw = await tr.json();
            const gRaw = await gr.json();

            const matches = toArray(mRaw, 'games');
            const teamsArr = toArray(tRaw, 'teams');
            const groups   = toArray(gRaw, 'groups');

            allTeams = {};
            teamsArr.forEach(t => {
                const id = String(t.id || t._id || t.team_id || '');
                if (id) allTeams[id] = t;
            });

            allMatches = matches;

            renderMatches(matches);
            renderGroups(groups);
            renderStandings(groups);
            renderBracket(matches);

            const now = new Date();
            const ts = now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('last-update').textContent = ts;
            document.getElementById('footer-update').textContent = ts;

        } catch(err) {
            console.error('Error:', err);
            setTimeout(fetchAll, 10000);
        }
    }

    // ── Tabs ───────────────────────────────────────────────
    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab + '-tab').classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // ── Init ───────────────────────────────────────────────
    fetchAll();
    setInterval(fetchAll, 5 * 60 * 1000);
    </script>
</body>
</html>
